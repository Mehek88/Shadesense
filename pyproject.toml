[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shadesense"
version = "0.1.0"
description = "Foundation and lipstick shade matching from one selfie"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["shadesense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
